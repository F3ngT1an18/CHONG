<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Admin | FNE</title>
    <audio id="background-music" autoplay loop>
        <source src="audio.MP3" type="audio/mpeg">
    </audio>
    <script src="music.js"></script>
</head>
<body>
    <main class="admin-page">
        <section id="login-panel" class="admin-panel">
            <h1>Admin <span>Login</span></h1>
            <form id="admin-login-form" class="admin-form">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="btn">Login</button>
                <p id="login-error" class="login-error" role="alert"></p>
                <a href="index.html" class="back-link">Back to website</a>
            </form>
        </section>

        <section id="admin-panel" class="admin-panel" hidden>
            <div class="admin-heading">
                <h1>Contact <span>Messages</span></h1>
                <button id="logout-button" class="btn" type="button">Logout</button>
            </div>
            <p id="empty-messages" class="empty-messages">No messages yet.</p>
            <div class="messages-table-wrapper">
                <table class="messages-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Message</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="messages-body"></tbody>
                </table>
            </div>
            <button id="clear-messages" class="btn danger-button" type="button">Clear Messages</button>
        </section>
    </main>
    <script src="admin.js"></script>
</body>
</html>
