<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
	<link rel="stylesheet" href="style.css">
	<title>Contact | FNE</title>
	<audio id="background-music" autoplay loop preload="auto">
		<source src="audio.MP3" type="audio/mpeg">
	</audio>
	<script src="music.js"></script>
</head>
<body>
	<header>
		<a href="admin.html" class="logo">FNE</a>
		<nav>
			<a href="index.html">Home</a>
			<a href="services.html">Store</a>
			<a href="skills.html">Skills</a>
			<a href="Education.html">Education</a>
			<a href="Experience.html">Services</a>
			<a href="Contact.html" class="active">Contact</a>
		</nav>
	</header>

	<main class="content-page contact-page contact-showcase">
		<section class="contact-hero"><div class="contact-badge">GET IN TOUCH</div><h1>Let's talk</h1><p>Have a question or want to arrange an order? Send a message and we will get back to you.</p></section>
		<div class="contact-layout"><form id="contact-form" class="contact-form" action="#" method="post"><label for="contact-name">Your name</label><input id="contact-name" type="text" name="name" placeholder="Enter your name" required><label for="contact-email">Email address</label><input id="contact-email" type="email" name="email" placeholder="you@example.com" required><label for="contact-message">Message</label><textarea id="contact-message" name="message" rows="6" placeholder="How can we help?" required></textarea><button type="submit" class="contact-button">Send message</button></form></div>
	</main>
	<script src="contact.js"></script>
	<script src="navigation.js"></script>
</body>
</html>
